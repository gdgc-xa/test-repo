<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Palm frond">
  <title>Palm frond</title>
  <defs>
    <!-- One leaflet: tapered lens, tip pointing +x -->
    <path id="leaflet" d="M 0 0 Q 34 -7 66 -2 Q 34 8 0 0 Z"/>
    <path id="leaflet-sm" d="M 0 0 Q 24 -5 46 -1 Q 24 6 0 0 Z"/>
    <linearGradient id="frond-g" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0"   stop-color="#7BC26C"/>
      <stop offset="1"   stop-color="#5FA850"/>
    </linearGradient>
    <linearGradient id="frond-g-dk" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0"   stop-color="#5FA850"/>
      <stop offset="1"   stop-color="#48853E"/>
    </linearGradient>
  </defs>

  <!-- ===== Lower/back leaflet fan (darker, reads as shadow side) ===== -->
  <g fill="url(#frond-g-dk)" stroke="#2E5028" stroke-width="1.4" stroke-linejoin="round">
    <use href="#leaflet"    transform="translate(28,18)   rotate(74)"/>
    <use href="#leaflet"    transform="translate(54,33)   rotate(78)"/>
    <use href="#leaflet"    transform="translate(82,50)   rotate(82)"/>
    <use href="#leaflet"    transform="translate(112,69)  rotate(86)"/>
    <use href="#leaflet"    transform="translate(143,90)  rotate(90)"/>
    <use href="#leaflet-sm" transform="translate(174,113) rotate(94)"/>
    <use href="#leaflet-sm" transform="translate(204,138) rotate(98)"/>
    <use href="#leaflet-sm" transform="translate(232,164) rotate(102)"/>
  </g>

  <!-- ===== Upper/front leaflet fan (lighter) ===== -->
  <g fill="url(#frond-g)" stroke="#2E5028" stroke-width="1.4" stroke-linejoin="round">
    <use href="#leaflet"    transform="translate(24,14)   rotate(-30)"/>
    <use href="#leaflet"    transform="translate(50,29)   rotate(-24)"/>
    <use href="#leaflet"    transform="translate(78,46)   rotate(-18)"/>
    <use href="#leaflet"    transform="translate(108,65)  rotate(-12)"/>
    <use href="#leaflet"    transform="translate(139,86)  rotate(-6)"/>
    <use href="#leaflet-sm" transform="translate(170,109) rotate(0)"/>
    <use href="#leaflet-sm" transform="translate(200,134) rotate(6)"/>
    <use href="#leaflet-sm" transform="translate(228,160) rotate(12)"/>
    <!-- Tip cluster -->
    <use href="#leaflet-sm" transform="translate(252,184) rotate(28)"/>
    <use href="#leaflet-sm" transform="translate(252,184) rotate(52)"/>
  </g>

  <!-- ===== Central rachis (stem) drawn over the leaflets ===== -->
  <path fill="none" stroke="#2E5028" stroke-width="5" stroke-linecap="round"
        d="M 12 4 Q 120 62 268 198"/>
  <path fill="none" stroke="#6FB35F" stroke-width="2" stroke-linecap="round"
        d="M 12 4 Q 120 62 268 198"/>
</svg>
