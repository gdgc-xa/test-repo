name: facebook-news

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  fetch-facebook-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Facebook posts
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_DEFAULT_TAG: ${{ vars.FB_DEFAULT_TAG }}
        run: node scripts/fetch-facebook-posts.mjs

      - name: Commit updated posts and images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/src/js/data/cup-posts.json docs/assets/news/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Facebook news posts"
            git push
          fi
