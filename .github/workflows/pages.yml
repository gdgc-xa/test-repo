# Puts the website online with GitHub Pages every time main changes.
#
# The site is two folders put together:
#   frontend/   → the site itself
#   database/   → served at /database/ (the site's data)
# npm run dev in frontend/ puts them together the same way on your computer.
#
# One-time setup (repo admin): Settings → Pages → Build and deployment →
# Source: "GitHub Actions" (instead of "Deploy from a branch").
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Put the site together
        run: |
          mkdir _site
          cp -r frontend/. _site/
          cp -r database _site/database

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
