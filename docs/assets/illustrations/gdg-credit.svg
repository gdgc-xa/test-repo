<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Google Developer Group mark">
  <title>GDG mark</title>
  <!-- Sun rays -->
  <g fill="#F4B400">
    <polygon points="20,2 22,7 18,7"/>
    <polygon points="20,38 22,33 18,33"/>
    <polygon points="38,20 33,22 33,18"/>
    <polygon points="2,20 7,22 7,18"/>
    <polygon points="33,7 28,10 26,7"/>
    <polygon points="33,33 28,30 26,33"/>
    <polygon points="7,33 12,30 14,33"/>
    <polygon points="7,7 12,10 14,7"/>
  </g>
  <!-- Sun body -->
  <circle cx="20" cy="20" r="10" fill="#E68A2E"/>
  <!-- Little code-brackets mark -->
  <text x="20" y="24" text-anchor="middle"
        font-family="'Iowan Old Style',Georgia,serif"
        font-size="9" font-weight="800" fill="#FDF6E4">&lt;/&gt;</text>
</svg>
